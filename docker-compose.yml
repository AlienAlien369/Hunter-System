services:
  postgres:
    image: postgres:16-alpine
    container_name: hunter_system_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hunterpass}
      POSTGRES_DB: ${POSTGRES_DB:-hunter_system}
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hunter -d hunter_system']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hunter_network

  adminer:
    image: adminer:latest
    container_name: hunter_adminer
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hunter_network

volumes:
  postgres_data:
    name: hunter_system_postgres_data

networks:
  hunter_network:
    driver: bridge
