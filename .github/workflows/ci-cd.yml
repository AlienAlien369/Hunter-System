name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # Job 1: Lint and Type Check
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: cd server && npm ci

      - name: Run linter
        run: npm run lint

      - name: Type check frontend
        run: npx tsc --noEmit

      - name: Type check backend
        run: cd server && npx tsc --noEmit

  # Job 2: Run Tests
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: hunter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: cd server && npm ci

      - name: Run frontend tests
        run: npm test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test_user
          DB_PASSWORD: test_pass
          DB_NAME: hunter_test
          JWT_SECRET: test-secret-key

      # The backend tests are integration tests: they call the REST API on
      # localhost:3000, so the server must be running (with its database
      # initialized) before they execute. Start it in the background and
      # wait until /api/health responds.
      - name: Start backend server
        run: |
          cd server
          DB_HOST=localhost \
          DB_PORT=5432 \
          DB_USER=test_user \
          DB_PASSWORD=test_pass \
          DB_NAME=hunter_test \
          JWT_SECRET=test-secret-key \
          DEMO_USER=demo_user \
          DEMO_PASS=DemoPass123! \
          nohup npx tsx src/index.ts > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
            # Surface server logs if it crashed during startup
            tail -5 /tmp/server.log
          done
          echo "Backend did not become healthy in time"
          cat /tmp/server.log
          exit 1

      - name: Run backend tests
        run: cd server && npm test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test_user
          DB_PASSWORD: test_pass
          DB_NAME: hunter_test
          JWT_SECRET: test-secret-key
          DEMO_USER: demo_user
          DEMO_PASS: DemoPass123!

      - name: Print backend server logs on failure
        if: failure()
        run: cat /tmp/server.log || true

  # Job 3: Build Frontend
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: /api

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  # Job 4: Build Backend
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: cd server && npm ci

      - name: Build backend
        run: cd server && npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: server/dist/
          retention-days: 7

  # Job 5: Docker Build & Push (on main branch only)
  docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: image
        env:
          REGISTRY: ghcr.io
        run: |
          # GHCR rejects uppercase characters in image paths; repository names
          # may contain them, so force lowercase (e.g. AlienAlien369/Hunter-System
          # → ghcr.io/alienalien369/hunter-system).
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "name=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Image name: ${IMAGE}"

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ${{ steps.image.outputs.name }}/frontend:latest
            ${{ steps.image.outputs.name }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ steps.image.outputs.name }}/backend:latest
            ${{ steps.image.outputs.name }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 6: Deploy to Production (manual trigger or auto-deploy)
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Only attempt SSH deployment when the required secrets exist; without
      # this the job would always fail on repos without server secrets.
      - name: Check deploy secrets
        id: secrets
        run: |
          if [ -n "${{ secrets.SERVER_HOST }}" ] && [ -n "${{ secrets.SERVER_SSH_KEY }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SERVER_HOST/SERVER_SSH_KEY not set — skipping SSH deployment"
          fi

      - name: Deploy to server via SSH
        if: steps.secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/hunter-system
            git pull origin main
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml exec backend npm run migrate || true
            docker system prune -f

      - name: Notify deployment
        if: success()
        run: |
          echo "✅ Pipeline successful!"
          echo "Frontend: ${{ vars.DEPLOY_URL }}"
          echo "Backend: ${{ vars.DEPLOY_URL }}/api/health"
