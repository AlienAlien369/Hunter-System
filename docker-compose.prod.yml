services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: hunter_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hunterpass}
      POSTGRES_DB: ${POSTGRES_DB:-hunter_system}
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hunter -d hunter_system']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hunter_network
    restart: unless-stopped

  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hunter_backend
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-hunter}
      - DB_PASSWORD=${DB_PASSWORD:-hunterpass}
      - DB_NAME=${DB_NAME:-hunter_system}
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - FRONTEND_URL=http://localhost
      - BACKEND_PORT=3000
      - DEMO_USER=${DEMO_USER:-demo_user}
      - DEMO_PASS=${DEMO_PASS:-DemoPass123!}
      - DEMO_NAME=${DEMO_NAME:-Demo Hunter}
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - hunter_network
    restart: unless-stopped

  # Frontend (Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: /api
    container_name: hunter_frontend
    ports:
      - '${FRONTEND_PORT:-80}:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/']
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - hunter_network
    restart: unless-stopped

  # Database Admin UI (optional, disable in production)
  adminer:
    image: adminer:latest
    container_name: hunter_adminer
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hunter_network
    restart: unless-stopped
    profiles:
      - debug

volumes:
  postgres_data:
    name: hunter_system_postgres_data

networks:
  hunter_network:
    driver: bridge
